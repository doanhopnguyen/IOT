[platformio]
src_dir = maintenance
build_dir = .pio/maintenance-build

[env:esp32-s3-maintenance]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; Không ghi cứng cổng COM: PlatformIO tự dò. Chọn tay bằng --upload-port COMx hoặc biến PLATFORMIO_UPLOAD_PORT.
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    miguelbalboa/MFRC522@1.4.12
    adafruit/Adafruit Fingerprint Sensor Library@2.1.3
