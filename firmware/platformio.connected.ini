[platformio]
default_envs = esp32-s3-connected
src_dir = connected_door
build_dir = .pio/connected-door-build

[env:esp32-s3-connected]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    chris--a/Keypad@3.1.1
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit ILI9341@1.6.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    miguelbalboa/MFRC522@1.4.12
    adafruit/Adafruit Fingerprint Sensor Library@2.1.3
    madhephaestus/ESP32Servo@3.0.6
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    ricmoo/QRCode@0.0.1

[env:esp32-s3-ota-demo]
extends = env:esp32-s3-connected
build_flags =
    ${env:esp32-s3-connected.build_flags}
    -D FIRMWARE_VERSION=\"2.0.5-demo\"
    -D FW_DEMO_BLACK_BUTTONS=1
