; Workshop-only helper. Requires the exact USB WIPE command; never drives the servo.
[platformio]
src_dir = factory_wipe
build_dir = .pio/factory-wipe-build
[env:esp32-s3-factory-wipe]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit Fingerprint Sensor Library@2.1.3
