# Broker nhóm trong Docker. Cổng 1884 giữ nguyên để Tailscale Funnel :8443 không phải đổi.
# Tài khoản do plugin dynamic-security quản lý: backend tạo client cho thiết bị khi admin nạp code.
# Sinh file ban đầu: python scripts/dynsec_config.py --out .local/team/mosquitto/dynamic-security.json --backend-password-from .local/team/server.json
listener 1884 0.0.0.0
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/team/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
