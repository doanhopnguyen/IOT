spring:
  application:
    name: smart-access-control-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_access?serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  servlet:
    session:
      timeout: 1h
      persistent: false
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  firmware:
    device-base-url: ${APP_DEVICE_BASE_URL:http://127.0.0.1:8080}
  face-processor:
    url: ${FACE_PROCESSOR_URL:http://127.0.0.1:8091/extract}
    token: ${FACE_PROCESSOR_TOKEN:}
  provisioning:
    mqtt-host: ${PROVISION_MQTT_HOST:}
    mqtt-port: ${PROVISION_MQTT_PORT:1884}
    mqtt-tls: ${PROVISION_MQTT_TLS:false}
    mqtt-ca-file: ${PROVISION_MQTT_CA_FILE:}
  usb:
    enabled: ${USB_ENABLED:false}
    python-executable: ${USB_PYTHON_EXECUTABLE:python}
    esptool-script: ${USB_ESPTOOL_SCRIPT:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    topic-prefix: ${MQTT_TOPIC_PREFIX:smartdoor-iot}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  face:
    allow-unverified-liveness: ${FACE_ALLOW_UNVERIFIED_LIVENESS:false}
    match-threshold: ${FACE_MATCH_THRESHOLD:0.5}
