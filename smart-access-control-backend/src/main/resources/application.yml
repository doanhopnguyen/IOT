spring:
  application:
    name: smart-access-control-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_access?serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  servlet:
    session:
      timeout: 1h
      persistent: false
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
    topic-prefix: ${MQTT_TOPIC_PREFIX:smartdoor-iot}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  face:
    allow-unverified-liveness: ${FACE_ALLOW_UNVERIFIED_LIVENESS:false}
    match-threshold: ${FACE_MATCH_THRESHOLD:0.5}
