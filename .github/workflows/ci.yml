name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build admin web into backend static
        working-directory: admin-web
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Backend tests
        working-directory: smart-access-control-backend
        run: mvn -B test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: IOT_mobile/package-lock.json
      - name: Typecheck and tests
        working-directory: IOT_mobile
        run: npm ci && npm run typecheck && npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Test Python không tải model nhận diện; script reset cần dependency local.
      - run: pip install numpy==2.4.2 -r scripts/requirements-local.txt
      - name: Face node tests
        working-directory: face-node
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Script tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/*.ini') }}
      - run: pip install platformio
      - name: Host firmware state tests
        run: python firmware/tests/test_offline_door.py && python firmware/tests/test_setup_flow.py && python firmware/tests/test_factory_reset.py && python firmware/tests/test_servo_preview.py && python firmware/tests/test_product_qr.py && python firmware/tests/test_unclaimed_wifi_reset.py && python firmware/tests/test_door_timing.py && python firmware/tests/test_door_restriction.py && python firmware/tests/test_physical_keypad.py && python firmware/tests/test_failed_attempt_reporting.py && python firmware/tests/test_wifi_storage.py
      - name: Build connected door firmware
        working-directory: firmware
        run: pio run -c platformio.connected.ini
      - name: Member credential removal on host
        run: python firmware/tests/test_member_removal.py && python firmware/tests/test_activation_qr_sync.py && python firmware/tests/test_device_retirement.py
      - name: Alarm and OTA behavior on host
        run: python firmware/tests/test_door_alarm.py && python firmware/tests/test_ota_policy.py && python firmware/tests/test_ota_transfer.py
      - name: Build black-button OTA demo
        working-directory: firmware
        run: pio run -c platformio.connected.ini -e esp32-s3-ota-demo
